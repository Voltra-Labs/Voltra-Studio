[package]
name = "voltra-core"
description = "Core vocabulary for Voltra Studio: shared types, errors and invariants."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror = { workspace = true }

[dev-dependencies]
# Default features pull in plotting; the numbers are what matter here, and a
# leaner dev-dependency keeps CI honest about compile time.
criterion = { version = "0.7", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "geometry"
harness = false

[lints]
workspace = true
