[package]
name = "voltra-capture"
description = "Capture for Voltra Studio: frames from the system, handed to the compositor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
voltra-core = { workspace = true }

triple_buffer = { workspace = true }

[dev-dependencies]
# Same lean configuration as the other crates: numbers, no plots.
criterion = { version = "0.7", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "delivery"
harness = false

[lints]
workspace = true
