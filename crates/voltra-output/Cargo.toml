[package]
name = "voltra-output"
description = "Muxers and transport for Voltra Studio: frames to a file or a wire."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
voltra-core = { workspace = true }

[dev-dependencies]
# Same lean configuration as the other crates: numbers, no plots.
criterion = { version = "0.7", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "matroska"
harness = false

[lints]
workspace = true
