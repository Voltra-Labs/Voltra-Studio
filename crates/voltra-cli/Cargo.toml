[package]
name = "voltra-cli"
description = "Headless front-end and development harness for Voltra Studio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "voltra"
path = "src/main.rs"

[features]
# H.264 recording through libavcodec (voltra-encode's `ffmpeg`).
ffmpeg = ["voltra-encode/ffmpeg"]
default = []
# Enables `voltra render --gpu`. Off by default so the default build needs no
# graphics stack at all.
gpu = ["voltra-render/gpu"]

[dependencies]
voltra-audio = { workspace = true }
voltra-core = { workspace = true }
voltra-encode = { workspace = true }
voltra-output = { workspace = true }
voltra-render = { workspace = true }
voltra-sources = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
