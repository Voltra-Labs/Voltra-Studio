name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any warning, matching the local quality gate.
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Default features must build and test on a headless runner with no GPU
      # and no capture devices. Native backends stay behind feature flags.
      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --workspace --release

  gpu:
    name: GPU backend (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # lavapipe is Mesa's software Vulkan rasteriser. It runs the same code
      # path a real GPU would, so the parity suite verifies correctness on a
      # runner with no graphics hardware. It says nothing about performance,
      # and no timing is taken here.
      - name: Install the software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Lints
        run: cargo clippy -p voltra-render --all-targets --features gpu -- -D warnings

      - name: Parity against the CPU compositor
        run: cargo test -p voltra-render --features gpu

  encode:
    name: Encoders (FFmpeg)
    # Pinned: `ffmpeg-sys-next` 6.1 binds FFmpeg 6.1's headers, which is what
    # Ubuntu 24.04 ships. Newer images ship an FFmpeg without `avfft.h`, and
    # moving to it is a dependency upgrade of its own, not a CI change.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The `ffmpeg` feature generates bindings from the installed FFmpeg
      # headers (bindgen needs libclang) and links the system libraries, which
      # also provide x264. The default build never needs any of this.
      - name: Install FFmpeg development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavutil-dev pkg-config clang libclang-dev ffmpeg

      - name: Lints
        run: |
          cargo clippy -p voltra-encode --all-targets --features ffmpeg -- -D warnings
          cargo clippy -p voltra-cli --all-targets --features ffmpeg -- -D warnings

      - name: Encoder tests
        run: cargo test -p voltra-encode --features ffmpeg

      # Records H.264 and measures its audio/video sync with ffmpeg.
      - name: Recording tests
        run: cargo test -p voltra-cli --features ffmpeg

  capture:
    name: Capture (PipeWire)
    # Pinned, as the encode job: PipeWire 1.0 is what the tests were measured
    # against.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The `pipewire` feature binds libpipewire's headers (bindgen needs
      # libclang). The tests bring up their own server — no session manager,
      # no D-Bus, no display — with a GStreamer test source as the producer.
      - name: Install PipeWire and a test source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev pkg-config clang libclang-dev pipewire \
            gstreamer1.0-pipewire gstreamer1.0-plugins-base gstreamer1.0-tools

      - name: Lints
        run: cargo clippy -p voltra-capture --all-targets --features pipewire -- -D warnings

      - name: Capture tests
        run: cargo test -p voltra-capture --features pipewire

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from the workspace
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # `+version` explicitly: `rust-toolchain.toml` would otherwise override
      # the toolchain installed above with stable, and the job would check
      # nothing. Default features only; `gpu` needs what `wgpu` needs (1.87).
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
