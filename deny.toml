# cargo-deny configuration. Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Voltra ships under GPL-2.0-or-later, so permissive dependency licences are
# compatible. Copyleft dependencies need an explicit decision, not a default.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    # ffmpeg-sys-next, the generated FFmpeg bindings behind voltra-encode's
    # `ffmpeg` feature. Permissive; FFmpeg itself is linked from the system.
    "WTFPL",
    "Zlib",
]
confidence-threshold = 0.9
# Voltra's own crates carry Voltra's licence. Allowing GPL-2.0-or-later for
# them by name, rather than in `allow`, keeps a copyleft dependency an explicit
# decision.
exceptions = [
    { crate = "voltra-audio", allow = ["GPL-2.0-or-later"] },
    { crate = "voltra-capture", allow = ["GPL-2.0-or-later"] },
    { crate = "voltra-cli", allow = ["GPL-2.0-or-later"] },
    { crate = "voltra-core", allow = ["GPL-2.0-or-later"] },
    { crate = "voltra-encode", allow = ["GPL-2.0-or-later"] },
    { crate = "voltra-output", allow = ["GPL-2.0-or-later"] },
    { crate = "voltra-render", allow = ["GPL-2.0-or-later"] },
    { crate = "voltra-sources", allow = ["GPL-2.0-or-later"] },
]

[bans]
# Duplicate versions bloat the binary and slow compiles; visible, not fatal.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
